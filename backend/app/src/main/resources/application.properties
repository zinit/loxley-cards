spring.application.name=loxley-cards

# Datasource — Supabase PostgreSQL via pgbouncer (transaction-mode, port 6543)
# DATABASE_URL must be JDBC format: jdbc:postgresql://host:6543/postgres?user=...&password=...
spring.datasource.url=${DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=10
# pgbouncer transaction-mode reuses physical connections — server-side prepared
# statements collide ("prepared statement S_X already exists"). Disable them.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA / Hibernate — Flyway owns DDL; Hibernate validates entity-schema match
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
