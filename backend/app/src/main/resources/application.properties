spring.application.name=loxley-cards

# Datasource — Supabase PostgreSQL via pgbouncer (transaction-mode, port 6543).
# Credentials SPLIT into separate properties on purpose: when password is embedded
# in spring.datasource.url query string, Hibernate's connection-pool printer logs
# the full URL (incl. password) at INFO on startup. With url/username/password as
# distinct properties, Hikari masks the password ("password=********") in all logs.
# DATABASE_URL must be JDBC format: jdbc:postgresql://host:6543/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
# pgbouncer transaction-mode reuses physical connections — server-side prepared
# statements collide ("prepared statement S_X already exists"). Disable them.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Defensive: silence the Hibernate connection-pool printer (logs JDBC URL +
# project ref + driver info at INFO on startup). With password already split off
# the leak surface is small, but the project ref / pooler host are still PII-ish
# for a public repo — keep them out of console output.
logging.level.org.hibernate.orm.connections.pooling=WARN

# JPA / Hibernate — Flyway owns DDL; Hibernate validates entity-schema match
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT — session token signing
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Cookie — Secure flag for HTTPS (off for local dev, on in prod profile)
app.cookie.secure=false
